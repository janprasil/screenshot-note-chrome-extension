<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <p class="status"><span id="dot" class="dot"></span><span id="status"></span></p>
    <label class="row"><input type="checkbox" id="enabled" /> <span data-i18n="recording"></span></label>
    <label class="row"><input type="checkbox" id="recordBodies" /> <span data-i18n="recordBodies"></span></label>
    <label class="row">
      <span data-i18n="buffer"></span>
      <select id="bufferMs">
        <option value="60000">1</option>
        <option value="120000">2</option>
        <option value="300000">5</option>
        <option value="600000">10</option>
      </select>
      <span data-i18n="minutes"></span>
    </label>
    <div class="actions">
      <button id="export" data-i18n="export"></button>
      <button id="reconnect" class="secondary" data-i18n="reconnect"></button>
    </div>
    <p class="hint" data-i18n="exportHint"></p>
    <p class="error" id="error" hidden></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
